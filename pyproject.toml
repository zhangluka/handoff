[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "handoff"
version = "0.1.0"
description = "Hand off context between AI coding agents — Claude Code to Cursor in one command"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["ai", "agent", "claude-code", "cursor", "handoff", "context", "sync"]

[project.scripts]
handoff = "handoff:main"

[tool.setuptools]
py-modules = ["handoff"]
